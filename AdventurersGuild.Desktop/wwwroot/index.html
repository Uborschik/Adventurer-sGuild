<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <HeadOutlet />
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#ff6b6b; color:white; padding:12px; font-family:sans-serif;">
        Unhandled error has occurred.
        <a href="" class="reload" style="color:white; text-decoration:underline;">Reload</a>
        <a class="dismiss" style="float:right; cursor:pointer;">🗙</a>
    </div>

    <script>
    window.appWindow = {
        close: function () {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage('close-app');
        },
        minimize: function () {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage('minimize-app');
        },
        toggleMaximize: function () {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage('toggle-maximize');
        },
        startDrag: function () {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage('start-drag');
        }
    };
    </script>

    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
